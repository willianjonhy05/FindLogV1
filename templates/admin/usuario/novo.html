<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Usuário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .erro { background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Cadastrar Novo Usuário</h1>

    <!-- Exibe os erros de validação, se houverem -->
    {% if erros %}
        <div class="erro">
            <ul>
                {% for erro in erros %}
                    <li>{{ erro }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <!-- O enctype="multipart/form-data" é OBRIGATÓRIO para o upload da foto -->
    <form action="{{ url_for('novo_usuario') }}" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" value="{{ usuario.nome if usuario else '' }}" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" value="{{ usuario.email if usuario else '' }}" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" value="{{ usuario.cpf if usuario else '' }}" placeholder="Apenas números ou com pontos" required>
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" value="{{ usuario.data_nascimento if usuario else '' }}" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" value="{{ usuario.telefone if usuario else '' }}">
        </div>

        <div class="form-group">
            <label for="tipo_usuario">Tipo de Usuário:</label>
            <select id="tipo_usuario" name="tipo_usuario" onchange="toggleSala(this.value)" required>
                <option value="1" {% if usuario and usuario.tipo_usuario == 1 %}selected{% endif %}>Administrador</option>
                <option value="2" {% if usuario and usuario.tipo_usuario == 2 %}selected{% endif %}>Usuário Comum</option>
                <option value="3" {% if usuario and usuario.tipo_usuario == 3 %}selected{% endif %}>Servidor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="instituicao_cnpj">Instituição:</label>
            <select id="instituicao_cnpj" name="instituicao_cnpj" required>
                <option value="">Selecione uma instituição</option>
                {% for inst in instituicoes %}
                    <option value="{{ inst.cnpj }}" {% if usuario and usuario.instituicao == inst.cnpj %}selected{% endif %}>
                        {{ inst.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Campo de sala condicional (Exibido apenas se for Servidor - valor 3) -->
        <div class="form-group" id="div_sala" style="display: {% if usuario and usuario.tipo_usuario == 3 %}block{% else %}none{% endif %};">
            <label for="sala_codigo">Sala:</label>
            <select id="sala_codigo" name="sala_codigo">
                <option value="">Selecione uma sala</option>
                {% for sala in salas %}
                    <option value="{{ sala.codigo }}" {% if usuario and usuario.sala == sala.codigo %}selected{% endif %}>
                        Sala {{ sala.numero }} - Prédio {{ sala.predio }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="foto_perfil">Foto de Perfil:</label>
            <input type="file" id="foto_perfil" name="foto_perfil" accept="image/*">
        </div>

        <button type="submit">Salvar Usuário</button>
        <a href="{{ url_for('lista_usuarios') }}">Cancelar</a>
    </form>

    <script>
        function toggleSala(valor) {
            const divSala = document.getElementById('div_sala');
            if (valor === '3') {
                divSala.style.display = 'block';
            } else {
                divSala.style.display = 'none';
            }
        }
    </script>
</body>
</html>
