{% extends "base.html" %}


{% block title %}
Nova Categoria
{% endblock %}



{% block content %}



<div class="welcome-card mb-4">


    <h1 class="fw-bold">

        <i class="bi bi-bookmarks"></i>

        Nova Categoria

    </h1>


    <p>

        Cadastre uma nova categoria no sistema.

    </p>


</div>





<div class="card table-card p-4">


    <form method="POST" action="{{ url_for('nova_categoria') }}">



        <div class="row g-4">



            <div class="col-12">


                <label class="form-label fw-semibold" for="nome">

                    Nome da Categoria

                </label>


                <input type="text" id="nome" name="nome" class="form-control"
                    placeholder="Ex: Eletrônicos" required>


            </div>






            <div class="col-12">


                <label for="descricao" class="form-label fw-semibold">

                    Descrição da Categoria

                </label>


                <textarea id="descricao" name="descricao" class="form-control" rows="3"
                    placeholder="Ex: Produtos eletrônicos de qualidade" required></textarea>

 

            </div>

        </div>

        <hr class="my-4">



        <div class="d-flex justify-content-end gap-3">


            <a href="{{ url_for('lista_categorias') }}" class="btn btn-outline-secondary">


                Cancelar

            </a>




            <button type="submit" class="btn btn-primary-custom">


                <i class="bi bi-check-circle"></i>

                Salvar


            </button>



        </div>



    </form>



</div>




{% endblock %}
