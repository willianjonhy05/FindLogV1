{% extends "base.html" %}


{% block title %}
Nova Instituição
{% endblock %}



{% block content %}



<div class="welcome-card mb-4">


    <h1 class="fw-bold">

        <i class="bi bi-building-add"></i>

        Nova Instituição

    </h1>


    <p>

        Cadastre uma nova instituição no sistema.

    </p>


</div>





<div class="card table-card p-4">


    <form method="POST" action="{{ url_for('nova_instituicao') }}">



        <div class="row g-4">



            <div class="col-md-8">


                <label class="form-label fw-semibold" for="nome">

                    Nome da Instituição

                </label>


                <input type="text" id="nome" name="nome" class="form-control"
                    placeholder="Ex: Instituto Achados e Perdidos LTDA." required>


            </div>





            <div class="col-md-4">


                <label for="cnpj" class="form-label fw-semibold">

                    CNPJ

                </label>


                <input id="cnpj" type="text" name="cnpj" placeholder="00.000.000/0000-00" class="form-control"
                    maxlength="18" required>


            </div>





            <div class="col-12">


                <label for="endereco" class="form-label fw-semibold">

                    Endereço

                </label>


                <input id="endereco" type="text" name="endereco" class="form-control"
                    placeholder="Ex: Rua Exemplo, 123 - Bairro, Cidade/UF" required>


            </div>






            <div class="col-md-6">


                <label for="telefone" class="form-label fw-semibold">

                    Telefone

                </label>


                <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone" class="form-control">


            </div>






            <div class="col-md-6">


                <label for="email" class="form-label fw-semibold">

                    E-mail

                </label>

                <input type="email" id="email" name="email" placeholder="Digite um endereço de e-mail válido"
                    class="form-control">
                <div class="invalid-feedback">
                    Por favor, digite um endereço de e-mail válido (ex: nome@dominio.com).
                </div>


            </div>



        </div>




        <hr class="my-4">





        <div class="d-flex justify-content-end gap-3">


            <a href="{{ url_for('lista_instituicoes') }}" class="btn btn-outline-secondary">


                Cancelar

            </a>




            <button type="submit" class="btn btn-primary-custom">


                <i class="bi bi-check-circle"></i>

                Salvar


            </button>



        </div>



    </form>



</div>




{% endblock %}


{% block scripts %}
    
    <script src="{{ url_for('static', filename='js/mascara.js') }}"></script>
{% endblock %}
