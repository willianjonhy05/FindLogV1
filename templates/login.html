<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FindLog</title>
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-body">

    <main class="login-container">
        
        <!-- CARD DE LOGIN -->
        <div class="login-card">
            
            <!-- IDENTIDADE VISUAL / LOGO -->
            <div class="text-center mb-4">
                <div class="logo d-inline-flex align-items-center justify-content-center gap-2 mb-2">
                    <span class="logo-icon-wrapper">
                        <i class="bi bi-search"></i>
                    </span>
                    <span class="logo-text">Find<span class="logo-accent">Log</span></span>
                </div>
                <h1 class="login-title">Acesso Restrito</h1>
                <p class="subtitle mb-0">
                    Entre com suas credenciais para gerenciar achados e perdidos
                </p>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form method="POST" action="{{ url_for('login') }}" novalidate>
                
                <!-- Campo E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label form-label-custom">
                        E-mail de Login
                    </label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input id="email" type="email" name="email" class="form-control form-control-custom" placeholder="seu@email.com" autocomplete="username" required>
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label form-label-custom">
                        Senha de Acesso
                    </label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="senha" id="senha" class="form-control form-control-custom" placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>
                </div>

                <!-- Esqueci Minha Senha -->
                <div class="d-flex justify-content-end mb-4">
                    <a href="#" class="forgot">
                        Esqueci minha senha
                    </a>
                </div>

                <!-- Botão de Login -->
                <button type="submit" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Entrar no sistema
                </button>

            </form>
        </div>

        <!-- RODAPÉ DA TELA DE LOGIN -->
        <footer class="login-footer text-center">
            <p class="mb-1">© 2026 <strong>FindLog</strong> — Todos os direitos reservados.</p>
            <p class="footer-subtext mb-0">Projeto desenvolvido pela Equipe Primeira Classe de Desenvolvimento</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
