<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Login | FindLog</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">




</head>



<body>



    <div class="login-container">



        <div class="login-card">



            <div class="logo mb-2">


                <i class="bi bi-search"></i>

                FindLog


            </div>



            <p class="subtitle">

                Acesse o painel administrativo

            </p>




            <form method="POST" action="{{ url_for('login') }}">





                <div class="mb-3">


                    <label for="email" class="form-label fw-semibold">

                        E-mail

                    </label>


                    <div class="input-group">


                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>



                        <input id="email" type="email" name="email" class="form-control" placeholder="seu@email.com" required>



                    </div>


                </div>







                <div class="mb-3">


                    <label for="senha" class="form-label fw-semibold">

                        Senha

                    </label>



                    <div class="input-group">


                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>



                        <input type="password" name="senha" id="senha" class="form-control" placeholder="Digite sua senha"
                            required>



                    </div>


                </div>







                <div class="d-flex justify-content-end mb-4">

                    <a href="#" class="forgot">

                        Esqueci minha senha

                    </a>

                </div>







                <button class="btn btn-login w-100">


                    <i class="bi bi-box-arrow-in-right"></i>


                    Entrar no sistema


                </button>





            </form>






        </div>




        <div class="footer">

            Projeto desenvolvido pela Equipe Primeira Classe de Desenvolvimento

        </div>




    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>

</html>
